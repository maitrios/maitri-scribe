# Written by the k7 GitHub standard (k7lab/infra metal/github/dependabot.ts, #260) from what maitrios/maitri-scribe holds.
# Edits here are drift: the next apply opens a PR that puts this back. Change metal/github/standard.yaml instead.
version: 2
multi-ecosystem-groups:
  deps:
    schedule:
      interval: cron
      cronjob: "50 1 * * 1,3,5"
      timezone: Pacific/Honolulu
    labels: ["kind:chore"]
    commit-message:
      prefix: "chore(deps)"
updates:
  - package-ecosystem: npm
    directories: ["/"]
    multi-ecosystem-group: deps
    patterns: ["*"]
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directories: ["/"]
    multi-ecosystem-group: deps
    patterns: ["*"]
    cooldown:
      default-days: 3
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
