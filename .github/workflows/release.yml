name: release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build-and-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          # No npm cache: this job publishes release assets, and a poisoned cache entry would end up in them.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Lint manifest
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build extension
        run: npx vici build -o dist

      - name: Package extension
        run: |
          set -euo pipefail
          TARBALL="maitri-scribe.tar.gz"
          tar -czf "$GITHUB_WORKSPACE/$TARBALL" -C "$GITHUB_WORKSPACE/dist" .
          cd "$GITHUB_WORKSPACE"
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          ls -la "$TARBALL" "$TARBALL.sha256"
          cat "$TARBALL.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            maitri-scribe.tar.gz
            maitri-scribe.tar.gz.sha256
